name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Lint, tests et build
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installation reproductible des dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Tests E2E
        run: npm run test:e2e

      - name: Build de production
        run: npm run build
